<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="portrait-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="1"/>
      <stop offset="60%" stop-color="#09090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rim-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim-warm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#portrait-bg)" />

  <!-- Studio Ambient Anamorphic Bokeh -->
  <circle cx="150" cy="200" r="180" fill="#0284c7" opacity="0.15" filter="blur(40px)" />
  <circle cx="650" cy="300" r="140" fill="#f59e0b" opacity="0.1" filter="blur(50px)" />

  <!-- Grid & Optical Crosshairs -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 8" />
  <line x1="400" y1="100" x2="400" y2="900" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 8" />

  <!-- Stylized Editorial Artist Silhouette & Dual Rim Light -->
  <g>
    <!-- Shoulders & Torso -->
    <path d="M 160 1000 L 220 720 L 320 620 L 480 620 L 580 720 L 640 1000 Z" fill="#121215" />
    <path d="M 220 720 L 320 620 L 400 700 L 480 620 L 580 720 Z" fill="#1c1c22" />
    
    <!-- Neck -->
    <rect x="360" y="520" width="80" height="120" fill="#18181d" rx="10" />

    <!-- Head & Jawline -->
    <ellipse cx="400" cy="420" rx="110" ry="140" fill="#202027" />
    
    <!-- Modern Hairstyle -->
    <path d="M 280 400 Q 300 240 400 230 Q 500 240 520 400 Q 400 280 280 400 Z" fill="#09090c" />
    <path d="M 290 370 Q 340 260 410 260 Q 470 260 510 380 Q 420 300 290 370 Z" fill="#121217" />
    
    <!-- Subtle Facial Features / Jaw Contour -->
    <path d="M 330 450 Q 400 560 470 450" fill="none" stroke="#2d2d38" stroke-width="3" />
    <path d="M 370 470 Q 400 500 430 470" fill="none" stroke="#373746" stroke-width="2" />
    
    <!-- Left Cool Blue Rim Light -->
    <path d="M 160 1000 L 220 720 L 320 620 L 360 520 L 310 450 L 290 370" fill="none" stroke="url(#rim-cyan)" stroke-width="6" />
    
    <!-- Right Warm Tungsten Rim Light -->
    <path d="M 640 1000 L 580 720 L 480 620 L 440 520 L 490 450 L 510 380" fill="none" stroke="url(#rim-warm)" stroke-width="6" />
  </g>

  <!-- VFX Compositor Viewfinder UI Elements -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <path d="M 40 70 L 70 70 M 40 70 L 40 100" />
    <path d="M 760 70 L 730 70 M 760 70 L 760 100" />
    <path d="M 40 930 L 70 930 M 40 930 L 40 900" />
    <path d="M 760 930 L 730 930 M 760 930 L 760 900" />
  </g>

  <text x="60" y="85" font-family="'Courier New', monospace" font-size="13" fill="#64748b" letter-spacing="3">PORTRAIT // ARTIST ID: AMAL_B_MATHEW</text>
  <text x="740" y="85" font-family="'Courier New', monospace" font-size="13" fill="#64748b" letter-spacing="3" text-anchor="end">ROLE: VFX ARTIST</text>

  <!-- Lower Title Tag -->
  <rect x="180" y="880" width="440" height="50" fill="#000000" opacity="0.85" rx="4" stroke="#27272a" stroke-width="1" />
  <text x="400" y="912" font-family="'Cinzel', 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" letter-spacing="6" text-anchor="middle">AMAL B MATHEW</text>
</svg>
