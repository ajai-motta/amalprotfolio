<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="final-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="1"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="80%" stop-color="#050508" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="flare-blue" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Final Cinematic Background with Starry Nebula & Sky -->
  <rect width="1920" height="1080" fill="url(#final-bg)" />
  
  <!-- Atmospheric Distant Planets & City Structure -->
  <circle cx="1400" cy="280" r="140" fill="#312e81" opacity="0.4" />
  <circle cx="1400" cy="280" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" />
  
  <!-- Sci-Fi Fortress Silhouette in Background -->
  <polygon points="960,240 1480,500 1380,720 540,720 440,500" fill="#090d16" />
  <line x1="960" y1="240" x2="960" y2="720" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  
  <!-- Atmospheric Ground Fog / Mist -->
  <path d="M 0 850 Q 480 750 960 820 T 1920 780 L 1920 1080 L 0 1080 Z" fill="#0f172a" opacity="0.95" />
  
  <!-- Integrated Hero Character in Dramatic Rim Lighting -->
  <g fill="#020617">
    <!-- Character with Rim Light Highlight Edges -->
    <ellipse cx="960" cy="380" rx="60" ry="75" fill="#0a0a0f" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 850 480 L 1070 480 L 1020 860 L 900 860 Z" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <path d="M 850 480 L 740 680 L 780 700 L 890 530 Z" fill="#07090e" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 1070 480 L 1180 620 L 1140 640 L 1030 530 Z" fill="#07090e" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 900 850 L 860 1080 L 920 1080 L 950 860 Z" fill="#020617" />
    <path d="M 970 850 L 1000 1080 L 1060 1080 L 1020 860 Z" fill="#020617" />
  </g>

  <!-- Glowing Energy Orb / Hand Power Effect -->
  <circle cx="760" cy="690" r="45" fill="url(#sun-burst)" />
  <circle cx="760" cy="690" r="15" fill="#ffffff" />
  
  <!-- Anamorphic Lens Flare Across Frame -->
  <rect x="0" y="682" width="1920" height="16" fill="url(#flare-blue)" />
  <ellipse cx="760" cy="690" rx="350" ry="8" fill="#38bdf8" opacity="0.6" />
  
  <!-- Secondary Bokeh and Flare Highlights -->
  <circle cx="1100" cy="690" r="30" fill="#0284c7" opacity="0.3" />
  <circle cx="1350" cy="690" r="60" fill="#0369a1" opacity="0.2" />

  <!-- Burn-in Timecode & Slate Overlay -->
  <rect x="60" y="60" width="460" height="90" fill="#000000" opacity="0.8" rx="6" />
  <text x="80" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#22c55e">FINAL_COMP_v12_APPROVED</text>
  <text x="80" y="135" font-family="'Courier New', monospace" font-size="16" fill="#f8fafc">COLOR GRADED • ACEScg • 4K SCOPE</text>

  <rect x="1400" y="60" width="460" height="90" fill="#000000" opacity="0.8" rx="6" />
  <text x="1420" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#22c55e">FINAL COMPOSITE</text>
  <text x="1420" y="135" font-family="'Courier New', monospace" font-size="16" fill="#cbd5e1">LIGHT INTEGRATION • ATMOSPHERE</text>
</svg>
