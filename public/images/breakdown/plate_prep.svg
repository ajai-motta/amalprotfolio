<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="clean-greenscreen" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#059669" stop-opacity="1"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    </pattern>
  </defs>
  
  <!-- Cleaned Green Screen Background -->
  <rect width="1920" height="1080" fill="url(#clean-greenscreen)" />
  <rect width="1920" height="1080" fill="url(#grid-pattern)" />
  
  <!-- Spline & Roto Curves Overlay (Nuke / Silhouette Style) -->
  <!-- Clean Isolated Actor Silhouette with Rotomattes -->
  <g fill="#18181b">
    <ellipse cx="960" cy="380" rx="60" ry="75" fill="#27272a" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 850 480 L 1070 480 L 1020 860 L 900 860 Z" fill="#27272a" stroke="#06b6d4" stroke-width="2" />
    <path d="M 850 480 L 740 680 L 780 700 L 890 530 Z" fill="#1f1f23" stroke="#06b6d4" stroke-width="2" />
    <path d="M 1070 480 L 1180 620 L 1140 640 L 1030 530 Z" fill="#1f1f23" stroke="#06b6d4" stroke-width="2" />
    <path d="M 900 850 L 860 1080 L 920 1080 L 950 860 Z" fill="#18181b" stroke="#06b6d4" stroke-width="2" />
    <path d="M 970 850 L 1000 1080 L 1060 1080 L 1020 860 Z" fill="#18181b" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Spline control points (Bezier handles) -->
  <g fill="#06b6d4">
    <circle cx="850" cy="480" r="5" />
    <circle cx="1070" cy="480" r="5" />
    <circle cx="740" cy="680" r="5" />
    <circle cx="1180" cy="620" r="5" />
    <circle cx="960" cy="305" r="5" />
  </g>

  <!-- Cleanplate Patch Zones (Showing wire removal & marker cleanup boxes) -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" fill="#f59e0b" fill-opacity="0.05">
    <!-- Cleaned Marker Boxes -->
    <rect x="270" y="170" width="60" height="60" rx="4" />
    <rect x="670" y="170" width="60" height="60" rx="4" />
    <rect x="1210" y="170" width="60" height="60" rx="4" />
    <rect x="1630" y="170" width="60" height="60" rx="4" />
    <!-- Cleaned Wire Rig Zones -->
    <polygon points="860,0 960,460 920,460 840,0" />
    <polygon points="1060,0 1000,460 960,460 1020,0" />
    <!-- Cleaned Mic Boom Area in Top Left -->
    <rect x="0" y="0" width="400" height="400" />
  </g>

  <g font-family="'Courier New', monospace" font-size="12" fill="#f59e0b">
    <text x="270" y="165">[CLEANED_01]</text>
    <text x="670" y="165">[CLEANED_02]</text>
    <text x="1210" y="165">[CLEANED_03]</text>
    <text x="830" y="30">[WIRE_REMOVAL_PASS]</text>
    <text x="20" y="420">[RIG_PAINTED_OUT]</text>
  </g>

  <!-- Burn-in Timecode & Slate Overlay -->
  <rect x="60" y="60" width="460" height="90" fill="#000000" opacity="0.8" rx="6" />
  <text x="80" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#06b6d4">PAINT_PREP_PASS_v03</text>
  <text x="80" y="135" font-family="'Courier New', monospace" font-size="16" fill="#f8fafc">CLEANPLATE • ROTOMATTE • DESPILL</text>

  <rect x="1400" y="60" width="460" height="90" fill="#000000" opacity="0.8" rx="6" />
  <text x="1420" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#f59e0b">PAINT &amp; PREP STAGE</text>
  <text x="1420" y="135" font-family="'Courier New', monospace" font-size="16" fill="#cbd5e1">WIRES REMOVED • MARKERS CLEANED</text>
</svg>
