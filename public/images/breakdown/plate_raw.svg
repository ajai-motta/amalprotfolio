<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="greenscreen" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00aa30" stop-opacity="1"/>
      <stop offset="100%" stop-color="#007720" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Green Screen Stage Background -->
  <rect width="1920" height="1080" fill="url(#greenscreen)" />
  
  <!-- Studio Seam & Grid Lines -->
  <line x1="0" y1="880" x2="1920" y2="880" stroke="#005515" stroke-width="4" />
  <line x1="400" y1="0" x2="400" y2="1080" stroke="#005515" stroke-width="1" stroke-dasharray="8 8" />
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#005515" stroke-width="1" stroke-dasharray="8 8" />
  <line x1="1520" y1="0" x2="1520" y2="1080" stroke="#005515" stroke-width="1" stroke-dasharray="8 8" />

  <!-- Tracking Crosses on Green Screen -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.85">
    <!-- Row 1 -->
    <path d="M 280 200 L 320 200 M 300 180 L 300 220" />
    <path d="M 680 200 L 720 200 M 700 180 L 700 220" />
    <path d="M 1220 200 L 1260 200 M 1240 180 L 1240 220" />
    <path d="M 1640 200 L 1680 200 M 1660 180 L 1660 220" />
    <!-- Row 2 -->
    <path d="M 280 450 L 320 450 M 300 430 L 300 470" />
    <path d="M 680 450 L 720 450 M 700 430 L 700 470" />
    <path d="M 1220 450 L 1260 450 M 1240 430 L 1240 470" />
    <path d="M 1640 450 L 1680 450 M 1660 430 L 1660 470" />
    <!-- Row 3 -->
    <path d="M 280 750 L 320 750 M 300 730 L 300 770" />
    <path d="M 680 750 L 720 750 M 700 730 L 700 770" />
    <path d="M 1220 750 L 1260 750 M 1240 730 L 1240 770" />
    <path d="M 1640 750 L 1680 750 M 1660 730 L 1660 770" />
  </g>

  <!-- Physical Wire Stunt Rigging Suspensions -->
  <line x1="880" y1="0" x2="940" y2="460" stroke="#cccccc" stroke-width="3" opacity="0.9" />
  <line x1="1040" y1="0" x2="980" y2="460" stroke="#cccccc" stroke-width="3" opacity="0.9" />
  <line x1="650" y1="0" x2="800" y2="520" stroke="#cccccc" stroke-width="2.5" opacity="0.8" />
  <line x1="1270" y1="0" x2="1120" y2="520" stroke="#cccccc" stroke-width="2.5" opacity="0.8" />

  <!-- Live Actor / Subject Silhouette on Stage -->
  <g fill="#18181b">
    <ellipse cx="960" cy="380" rx="60" ry="75" fill="#27272a" /> <!-- Head -->
    <path d="M 850 480 L 1070 480 L 1020 860 L 900 860 Z" fill="#27272a" /> <!-- Torso -->
    <path d="M 850 480 L 740 680 L 780 700 L 890 530 Z" fill="#1f1f23" /> <!-- Left Arm Raised -->
    <path d="M 1070 480 L 1180 620 L 1140 640 L 1030 530 Z" fill="#1f1f23" /> <!-- Right Arm -->
    <path d="M 900 850 L 860 1080 L 920 1080 L 950 860 Z" fill="#18181b" /> <!-- Left Leg -->
    <path d="M 970 850 L 1000 1080 L 1060 1080 L 1020 860 Z" fill="#18181b" /> <!-- Right Leg -->
    <!-- Safety Harness Hardware Attached -->
    <rect x="910" y="470" width="100" height="70" fill="#3f3f46" rx="4" />
    <circle cx="940" cy="470" r="10" fill="#e2e8f0" />
    <circle cx="980" cy="470" r="10" fill="#e2e8f0" />
  </g>

  <!-- Green Spill on Subject Edges -->
  <ellipse cx="960" cy="380" rx="64" ry="78" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.6" />
  <path d="M 845 475 L 1075 475 L 1025 865 L 895 865 Z" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.5" />

  <!-- Studio Mic Boom / C-Stand intrusion in corner -->
  <polygon points="0,0 220,0 0,380" fill="#111827" opacity="0.7" />
  <line x1="220" y1="0" x2="350" y2="180" stroke="#4b5563" stroke-width="8" />
  <ellipse cx="360" cy="190" rx="30" ry="15" fill="#374151" />

  <!-- Burn-in Timecode & Slate Overlay -->
  <rect x="60" y="60" width="460" height="90" fill="#000000" opacity="0.75" rx="6" />
  <text x="80" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#ef4444">PLATE_010_RAW_A01</text>
  <text x="80" y="135" font-family="'Courier New', monospace" font-size="16" fill="#f8fafc">TC: 01:14:22:18 | ISO 800</text>

  <rect x="1400" y="60" width="460" height="90" fill="#000000" opacity="0.75" rx="6" />
  <text x="1420" y="105" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#eab308">RAW CAMERA PLATE</text>
  <text x="1420" y="135" font-family="'Courier New', monospace" font-size="16" fill="#cbd5e1">UNPROCESSED GREENSCREEN &amp; RIGS</text>
</svg>
