<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="furiosa-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="desert-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#09090b" />
  <rect width="1200" height="800" fill="url(#furiosa-glow)" opacity="0.8" />
  
  <!-- Desert Dunes & Citadel silhouettes -->
  <path d="M 0 650 Q 300 550 600 680 T 1200 620 L 1200 800 L 0 800 Z" fill="#1c1917" opacity="0.9" />
  <path d="M 0 520 Q 450 420 900 570 T 1200 480 L 1200 800 L 0 800 Z" fill="#292524" opacity="0.6" />
  <polygon points="450,280 500,450 400,450" fill="#44403c" opacity="0.5" />
  <polygon points="750,240 820,480 680,480" fill="#292524" opacity="0.7" />
  
  <!-- Anamorphic Lens Flare Line -->
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <circle cx="600" cy="360" r="160" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3" />

  <!-- Tracking / VFX Markers -->
  <g stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
    <path d="M 220 200 L 260 200 M 240 180 L 240 220" />
    <path d="M 940 200 L 980 200 M 960 180 L 960 220" />
  </g>

  <!-- Title & Metadata -->
  <text x="600" y="350" font-family="'Cinzel', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#fef3c7" letter-spacing="10" text-anchor="middle">FURIOSA</text>
  <text x="600" y="400" font-family="'Cinzel', 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#fb923c" letter-spacing="6" text-anchor="middle">A MAD MAX SAGA</text>
  <text x="600" y="450" font-family="'Courier New', monospace" font-size="16" font-weight="600" fill="#f97316" letter-spacing="6" text-anchor="middle">[ 2024 • WARNER BROS. ]</text>
  <text x="600" y="490" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#a8a29e" letter-spacing="4" text-anchor="middle">ENVIRONMENT PREP • WIRE CLEANUP • COMPOSITING</text>

  <!-- Viewfinder Frame -->
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1" />
  <text x="70" y="85" font-family="'Courier New', monospace" font-size="12" fill="#78716c" letter-spacing="2">REC [●] 23.98 FPS | ANAMORPHIC</text>
  <text x="1130" y="85" font-family="'Courier New', monospace" font-size="12" fill="#78716c" letter-spacing="2" text-anchor="end">DESERT EXT. PLATE • DAY / DUSK</text>
</svg>
