<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="lasso-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#b91c1c" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="#09090b" />
  <rect width="1200" height="800" fill="url(#lasso-glow)" opacity="0.8" />
  
  <!-- Football Stadium Floodlights & Pitch Lines -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#f8fafc" stroke-width="2" opacity="0.3" />
  <circle cx="600" cy="550" r="120" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.3" />
  <line x1="600" y1="430" x2="600" y2="670" stroke="#f8fafc" stroke-width="2" opacity="0.3" />

  <!-- Stadium Crowd CG extension grid -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.4">
    <line x1="200" y1="200" x2="400" y2="450" stroke-dasharray="4 4" />
    <line x1="1000" y1="200" x2="800" y2="450" stroke-dasharray="4 4" />
  </g>

  <!-- Title & Metadata -->
  <text x="600" y="360" font-family="'Cinzel', 'Helvetica Neue', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="12" text-anchor="middle">TED LASSO</text>
  <text x="600" y="420" font-family="'Courier New', monospace" font-size="16" font-weight="600" fill="#60a5fa" letter-spacing="6" text-anchor="middle">[ YEAR TO BE VERIFIED • APPLE TV+ ]</text>
  <text x="600" y="465" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="4" text-anchor="middle">CROWD MULTIPLICATION • STADIUM EXTENSION • DIGITAL CLEANUP</text>

  <!-- Viewfinder Frame -->
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="70" y="85" font-family="'Courier New', monospace" font-size="12" fill="#64748b" letter-spacing="2">SERIES PRODUCTION • DIGITAL INTERMEDIATE</text>
  <text x="1130" y="85" font-family="'Courier New', monospace" font-size="12" fill="#64748b" letter-spacing="2" text-anchor="end">APPLE ORIGINAL</text>
</svg>
