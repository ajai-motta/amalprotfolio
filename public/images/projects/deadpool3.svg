<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="dp-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="slash-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="cinematic-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="#09090b" />
  <rect width="1200" height="800" fill="url(#dp-glow)" opacity="0.8" />
  
  <!-- Cinematic Grid & Anamorphic Lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="8 8" />
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="8 8" />
  
  <!-- Dynamic Slashes / Katanas VFX motif -->
  <path d="M 200 800 L 950 0 L 1020 0 L 270 800 Z" fill="url(#slash-gold)" opacity="0.4" filter="url(#cinematic-blur)" />
  <path d="M 220 800 L 970 0 L 990 0 L 240 800 Z" fill="#ffffff" opacity="0.6" />
  <path d="M 1000 800 L 250 0 L 180 0 L 930 800 Z" fill="#e11d48" opacity="0.3" filter="url(#cinematic-blur)" />
  
  <!-- Dual Mask Silhouette & Energy Rings -->
  <circle cx="600" cy="400" r="180" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4" />
  <circle cx="600" cy="400" r="170" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="10 20" opacity="0.5" />
  
  <!-- Tracking Markers (VFX homage) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <path d="M 280 230 L 320 230 M 300 210 L 300 250" />
    <path d="M 880 230 L 920 230 M 900 210 L 900 250" />
    <path d="M 300 580 L 340 580 M 320 560 L 320 600" />
    <path d="M 900 580 L 940 580 M 920 560 L 920 600" />
  </g>

  <!-- Title & Metadata -->
  <text x="600" y="380" font-family="'Cinzel', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="12" text-anchor="middle">DEADPOOL 3</text>
  <text x="600" y="440" font-family="'Courier New', monospace" font-size="16" font-weight="600" fill="#ef4444" letter-spacing="8" text-anchor="middle">[ 2024 • MARVEL STUDIOS ]</text>
  <text x="600" y="480" font-family="'Courier New', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="4" text-anchor="middle">PAINT &amp; PREP • ROTOPREP • PLATE CLEANUP</text>

  <!-- Viewfinder Frame -->
  <rect x="50" y="50" width="1100" height="700" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="70" y="85" font-family="'Courier New', monospace" font-size="12" fill="#64748b" letter-spacing="2">REC [●] 23.98 FPS | 2.39:1 SCOPE</text>
  <text x="1130" y="85" font-family="'Courier New', monospace" font-size="12" fill="#64748b" letter-spacing="2" text-anchor="end">4K RAW • COLOR ACEScg</text>
</svg>
